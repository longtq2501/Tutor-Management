services:
  db:
    image: mysql:8.0
    container_name: mysql_db_prod
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USERNAME:-myuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mypassword}
    volumes:
      - db_data_prod:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - tutor-network

  backend:
    image: ${DOCKERHUB_USERNAME}/tutor-backend:latest
    container_name: spring_backend_prod
    restart: always
    mem_limit: 1024m # Container Backend được cấp trần 1GB RAM
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD} 
# Sắp tới nếu dùng user riêng, nên là MYSQL_PASSWORD
      APP_INIT_DATA_ENABLED: ${INIT_DATA_ENABLED:-true}
      SPRING_PROFILES_ACTIVE: prod
      # Cấu hình bung lụa trên VPS 4GB RAM: Cache cực lớn, CPU rảnh rang 
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m -XX:+UseG1GC -XX:MaxMetaspaceSize=256m}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION}
      APP_JWT_REFRESH_EXPIRATION: ${APP_JWT_REFRESH_EXPIRATION}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      MAIL_HOST: ${SPRING_MAIL_HOST}
      MAIL_PORT: ${SPRING_MAIL_PORT}
      MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_MAIL_FROM: ${APP_MAIL_FROM}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}
      ONLINE_SESSION_JWT_SECRET: ${ONLINE_SESSION_JWT_SECRET}
    networks:
      - tutor-network

  frontend:
    image: ${DOCKERHUB_USERNAME}/tutor-frontend:latest
    container_name: nextjs_frontend_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      # URL Backend API khi được gọi từ trình duyệt. Ở Production, API phải trỏ đến Domain (VD: https://api.tutor.com)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    networks:
      - tutor-network

  nginx:
    image: nginx:latest
    container_name: nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # Mount SSL certificates (adjust path to your cert location on VPS)
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ssl/private:/etc/ssl/private:ro
      # Optional: mount logs directory
      - ./logs/nginx:/var/log/nginx:rw
    depends_on:
      - backend
      - frontend
    networks:
      - tutor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  tutor-network:
    driver: bridge

volumes:
  db_data_prod:
